spring.application.name=basic

# 8082: la 8080 è occupata sulla macchina e la 8081 è del backend principale,
# così i due progetti possono girare insieme.
server.port=8082

# Persistenza: H2 solo in memoria, ricreato a ogni avvio. Schema generato da
# Hibernate, poi popolato da data.sql.
spring.datasource.url=jdbc:h2:mem:basic
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
# Console web del database: http://localhost:8082/h2-console (JDBC URL jdbc:h2:mem:basic)
spring.h2.console.enabled=true

