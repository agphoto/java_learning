# Testi d'errore per l'utente — italiano (lingua di default e di ripiego).
# Chiavi: error.<code-in-kebab-case>.title | .detail
# Attenzione: MessageFormat è sempre attivo (spring.messages.always-use-message-format),
# quindi ogni apostrofo va scritto due volte: l''indirizzo.

error.book-not-found.title=Libro non trovato
error.book-not-found.detail=Non esiste alcun libro con identificativo {0}.
error.user-not-found.title=Utente non trovato
error.user-not-found.detail=Non esiste alcun utente con identificativo {0}.
error.book-already-on-loan.title=Libro già in prestito
error.book-already-on-loan.detail=Il libro richiesto è già in prestito: potrai prenderlo quando verrà restituito.
error.loan-limit-exceeded.title=Limite di prestiti superato
error.loan-limit-exceeded.detail=Hai già {0} libri in prestito: restituiscine uno prima di prenderne un altro.
error.duplicate-isbn.title=ISBN già presente
error.duplicate-isbn.detail=Esiste già un libro con questo ISBN.
error.validation-failed.title=Dati non validi
error.validation-failed.detail=Alcuni campi non sono validi: correggili e riprova.
error.malformed-request.title=Richiesta non leggibile
error.malformed-request.detail=Il contenuto della richiesta non è nel formato atteso.
error.type-mismatch.title=Parametro non valido
error.type-mismatch.detail=Un parametro della richiesta non ha il formato atteso.
error.resource-not-found.title=Risorsa non trovata
error.resource-not-found.detail=L''indirizzo richiesto non esiste.
error.method-not-allowed.title=Operazione non consentita
error.method-not-allowed.detail=L''operazione richiesta non è supportata su questo indirizzo.
error.unauthenticated.title=Autenticazione richiesta
error.unauthenticated.detail=Per questa operazione devi autenticarti.
error.access-denied.title=Accesso negato
error.access-denied.detail=Non hai i permessi necessari per questa operazione.
error.external-service-error.title=Errore del servizio esterno
error.external-service-error.detail=Il catalogo esterno ha risposto con un errore. Riprova più tardi.
error.external-service-unavailable.title=Servizio esterno non disponibile
error.external-service-unavailable.detail=Il catalogo esterno non è al momento raggiungibile. Riprova più tardi.
error.internal-error.title=Errore interno
error.internal-error.detail=Si è verificato un errore inatteso. Se il problema persiste, contatta l''assistenza indicando il codice di traccia.

# Eccezioni standard di Spring senza codice di catalogo: chiavi di ErrorResponse
problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo di contenuto non supportato
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Il tipo di contenuto {0} non è supportato.

# Validazione (capitolo 06). Le chiavi seguono i codici di Spring, dal più specifico
# (Vincolo.oggetto.campo) al più generale (Vincolo). Argomenti: {0} = campo, poi gli
# attributi del vincolo in ordine alfabetico (per Size: {1} = max, {2} = min).
NotBlank=Il campo è obbligatorio.
NotNull=Il campo è obbligatorio.
Positive=Il valore deve essere positivo.
Size=Il testo può contenere al massimo {1} caratteri.
Pattern=Il formato non è valido.
Pattern.bookRequest.isbn=L''ISBN deve essere composto da 13 cifre.
