spring.application.name=eccezioni

# 8081 e non 8080: sulla macchina di sviluppo la 8080 è già occupata.
server.port=8081

# Persistenza: H2 in memoria, schema generato da Hibernate, poi data.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Messaggi: senza questa riga una richiesta in italiano (per cui non esiste
# messages_it.properties) cadrebbe sulla lingua del sistema, che potrebbe essere l'inglese.
spring.messages.fallback-to-system-locale=false
# MessageFormat sempre attivo: la regola sugli apostrofi ('') vale per ogni testo,
# con o senza argomenti.
spring.messages.always-use-message-format=true

# Catalogo esterno simulato (capitolo 08): la stessa applicazione, sulla sua porta.
catalog.base-url=http://localhost:${local.server.port:${server.port}}
# Timeout dei client HTTP: senza, un servizio esterno lento blocca i thread del server.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# Tracing (capitolo 09): campionamento completo, nessun exporter configurato.
# Il traceId compare nei log (pattern di default di Boot) e nei ProblemDetail.
management.tracing.sampling.probability=1.0
