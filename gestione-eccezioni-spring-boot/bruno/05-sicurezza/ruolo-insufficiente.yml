info:
  name: Ruolo insufficiente
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/admin/stats"
  auth:
    type: basic
    username: "{{utenteUsername}}"
    password: "{{utentePassword}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: ACCESS_DENIED

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
