info:
  name: Credenziali errate
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/admin/stats"
  auth:
    type: basic
    username: "{{adminUsername}}"
    password: sbagliata

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.headers["www-authenticate"]
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Niente header `WWW-Authenticate`: il browser non apre la finestra di login nativa."
