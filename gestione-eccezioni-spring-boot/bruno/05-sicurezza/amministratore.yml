info:
  name: Amministratore
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/admin/stats"
  auth:
    type: basic
    username: "{{adminUsername}}"
    password: "{{adminPassword}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.books
      operator: isNumber
    - expression: res.body.loans
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
