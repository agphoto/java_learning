info:
  name: Senza credenziali
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/admin/stats"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: UNAUTHENTICATED

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
