info:
  name: Libro inesistente
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/books/999"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: BOOK_NOT_FOUND
    - expression: res.body.type
      operator: eq
      value: https://java-learning.local/errors/book-not-found
    - expression: res.body.instance
      operator: eq
      value: /api/books/999
    - expression: res.body.detail
      operator: contains
      value: "999"
    - expression: res.body.traceId
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
