info:
  name: Inglese
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/books/999"
  headers:
    - name: Accept-Language
      value: en

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.code
      operator: eq
      value: BOOK_NOT_FOUND
    - expression: res.body.title
      operator: eq
      value: Book not found

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
