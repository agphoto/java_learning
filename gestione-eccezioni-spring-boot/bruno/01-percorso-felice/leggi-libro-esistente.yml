info:
  name: Leggi libro esistente
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/books/1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/json
    - expression: res.body.isbn
      operator: eq
      value: '"9788804668237"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
