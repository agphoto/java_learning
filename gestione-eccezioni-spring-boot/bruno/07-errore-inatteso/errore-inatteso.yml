info:
  name: Bug simulato
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/diagnostics/unexpected-error"

runtime:
  scripts:
    - type: tests
      code: |-
        test("il messaggio dell'eccezione non arriva al client", function () {
          expect(JSON.stringify(res.body)).to.not.contain("segreto");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "500"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: INTERNAL_ERROR
    - expression: res.body.traceId
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Cercare nei log del backend il `traceId` della risposta: lì c'è lo stack trace completo."
