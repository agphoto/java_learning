info:
  name: Id non positivo
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/books/-1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: VALIDATION_FAILED
    - expression: res.body.errors[0].field
      operator: eq
      value: id
    - expression: res.body.errors[0].code
      operator: eq
      value: Positive

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Validazione dei parametri del metodo (`@Positive` sul `@PathVariable`):
  `HandlerMethodValidationException`, stessa forma della validazione del body.
