info:
  name: Id non numerico
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/books/abc"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: TYPE_MISMATCH

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
