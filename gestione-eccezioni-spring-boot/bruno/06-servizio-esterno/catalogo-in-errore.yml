info:
  name: Catalogo in errore
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/books/1/catalog-info?simulate=error"
  params:
    - name: simulate
      value: error
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("il dettaglio interno del catalogo non trapela", function () {
          expect(JSON.stringify(res.body)).to.not.contain("NullPointerException");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "502"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: EXTERNAL_SERVICE_ERROR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
