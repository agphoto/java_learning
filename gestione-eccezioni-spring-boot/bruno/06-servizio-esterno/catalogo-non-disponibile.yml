info:
  name: Catalogo non disponibile
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/books/1/catalog-info?simulate=unavailable"
  params:
    - name: simulate
      value: unavailable
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "503"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: EXTERNAL_SERVICE_UNAVAILABLE

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
