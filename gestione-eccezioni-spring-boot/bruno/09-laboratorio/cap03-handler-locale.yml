info:
  name: Cap. 03 - Handler locale
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/laboratorio/capitolo03/local"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body
      operator: eq
      value: gestito localmente

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: L'`@ExceptionHandler` del controller vince su `PrimoAdvice`, che pure copre il controller.
