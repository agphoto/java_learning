info:
  name: Cap. 03 - Ordine degli advice
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/laboratorio/capitolo03/state"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body
      operator: eq
      value: '"primo: RuntimeException"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `SecondoAdvice` ha un handler esatto per `IllegalStateException`, ma `PrimoAdvice`
  viene prima: tra advice diversi conta l'ordine, non la specificità.
