info:
  name: Cap. 02 - Eccezione non gestita
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/laboratorio/capitolo02/unhandled"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "500"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/json
    - expression: res.body.error
      operator: eq
      value: Internal Server Error
    - expression: res.body.path
      operator: eq
      value: /laboratorio/capitolo02/unhandled
    - expression: res.body.code
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Nessun resolver la gestisce: il container inoltra a `/error` e risponde il
  `BasicErrorController` di Boot, con il suo formato e non con un `ProblemDetail`.
