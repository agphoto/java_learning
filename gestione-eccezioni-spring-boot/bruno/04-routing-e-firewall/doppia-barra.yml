info:
  name: Doppia barra nell'URL
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api//books/1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: MALFORMED_REQUEST

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
