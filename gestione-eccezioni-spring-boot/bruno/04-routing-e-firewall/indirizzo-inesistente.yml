info:
  name: Indirizzo inesistente
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/inesistente"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.body.code
      operator: eq
      value: RESOURCE_NOT_FOUND

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
