info:
  name: Metodo non consentito
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/api/books/1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "405"
    - expression: res.headers["content-type"]
      operator: contains
      value: application/problem+json
    - expression: res.headers.allow
      operator: eq
      value: GET
    - expression: res.body.code
      operator: eq
      value: METHOD_NOT_ALLOWED

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
